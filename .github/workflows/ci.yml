name: CI Cross-Platform Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        build_type: [ Release ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python for Conan
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan and Ninja
        run: |
          python -m pip install --upgrade pip
          pip install conan ninja

      - name: Windows - Install Ninja
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Detect Conan profile
        run: conan profile detect --force

      # --- Linux specific setup ---
      - name: Linux - Install dependencies via Conan
        if: runner.os == 'Linux'
        run: |
          conan install . --output-folder=build -s build_type=${{ matrix.build_type }} --build=missing

      # --- macOS specific setup ---
      - name: macOS - Install dependencies via Homebrew
        if: runner.os == 'macOS'
        run: |
          brew install grpc protobuf googletest cmake ninja

      # --- Windows specific setup ---
      - name: Windows - Install dependencies via Conan
        if: runner.os == 'Windows'
        run: |
          conan install . --output-folder=build -s compiler.version=194 -s compiler.cppstd=14 -s build_type=${{ matrix.build_type }} --build=missing

      # --- Build & Test on Linux & Windows (Conan Toolchain) ---
      - name: Configure CMake (Conan Toolchain)
        if: runner.os != 'macOS'
        run: |
          cmake -S . -B build -G "Ninja" "-DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake" "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}"

      # --- Build & Test on macOS (Homebrew Toolchain) ---
      - name: Configure CMake (macOS Homebrew)
        if: runner.os == 'macOS'
        run: |
          BREW_PREFIX=$(brew --prefix)
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH="${BREW_PREFIX}"

      - name: Build all targets
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Unit and Integration Tests
        run: |
          ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Run Financial Pipeline Benchmark (1.0 GB)
        run: |
          ./build/financial_pipeline_benchmark --gb 1.0
        if: runner.os != 'Windows'

      - name: Run Financial Pipeline Benchmark on Windows (1.0 GB)
        run: |
          .\build\financial_pipeline_benchmark.exe --gb 1.0
        if: runner.os == 'Windows'
